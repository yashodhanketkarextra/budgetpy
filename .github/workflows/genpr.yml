name: Test and create PR
on:
  push:
    branches:
      - dev

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          export SECRET_KEY=$(openssl rand -hex 32)
          PY_ENV=test pytest

  create-pr:
    needs: test
    if: github.actor == 'yashodhanketkar'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Create PR with GitHub CLI
        run: |
          gh pr create \
            --base main \
            --head ${{ github.ref_name }} \
            --title "Automated PR: ${{ github.ref_name }}" \
            --body "FastAPI tests passed successfully. Created automatically by GitHub Actions."
